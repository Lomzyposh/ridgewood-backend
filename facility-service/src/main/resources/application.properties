spring.application.name=facility-service

server.port=${PORT:8088}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/facility_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Must use the same signing secret as user/team/payment services
security.jwt.secret=${JWT_SECRET:ThisIsADevelopmentSecretKeyThatMustBeReplaced1234567890}