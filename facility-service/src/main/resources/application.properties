spring.application.name=facility-service
server.port=8088

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/facility_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Must be the same signing secret used by the authentication/team services.
# HS256 requires a sufficiently long secret (32+ bytes recommended).
security.jwt.secret=${JWT_SECRET:ThisIsADevelopmentSecretKeyThatMustBeReplaced1234567890}

