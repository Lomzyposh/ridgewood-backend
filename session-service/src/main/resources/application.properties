spring.application.name=session-service

server.port=${PORT:8084}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/session_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Must match the signing secret used by user-service/team-service
app.jwt.secret=${JWT_SECRET:ThisIsADevelopmentSecretKeyThatMustBeReplaced1234567890}