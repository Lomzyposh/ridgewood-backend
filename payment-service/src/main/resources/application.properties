spring.application.name=payment-service
server.port=${SERVER_PORT:8087}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:ThisIsADevelopmentSecretKeyThatMustBeReplaced1234567890}
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
ridgewood.subscription.amount-kobo=${COACH_SUBSCRIPTION_AMOUNT_KOBO:1000000}
ridgewood.frontend.payment-callback-url=${PAYMENT_CALLBACK_URL:http://localhost:5173/coach/dashboard?payment=callback}
