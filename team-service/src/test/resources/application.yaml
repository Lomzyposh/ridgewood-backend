spring:
  datasource:
    url: jdbc:h2:mem:team_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

jwt:
  secret: your-256-bit-secret-key-change-this-in-production-please
